[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assertion-review-agent"
version = "0.1.0"
description = "Deterministic static review of SystemVerilog Assertions (SVA) before formal/simulation runs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Assertion Review Agent contributors" }]
keywords = ["sva", "systemverilog", "assertions", "formal", "verification", "lint"]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
assertion-review = "assertion_review.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assertion_review = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # typer uses function calls in argument defaults by design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
