[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verification-agent-factory"
version = "0.1.0"
description = "Generator for research-grade, verification-integrated agent repositories (public, non-proprietary)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Verification tooling author" }]
keywords = ["verification", "sva", "formal", "rtl", "codegen", "agent"]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
yaml = ["pyyaml>=6"]

[project.scripts]
vaf = "verification_agent_factory.cli:app"
verification-agent-factory = "verification_agent_factory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"verification_agent_factory" = ["py.typed", "templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Typer idiomatically uses function calls (typer.Argument/Option) as defaults.
"src/verification_agent_factory/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
