[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cx-triage"
version = "0.1.0"
description = "Counterexample Triage Agent: deterministic, evidence-grounded triage of formal/simulation counterexamples."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Counterexample Triage Agent contributors" }]
keywords = ["formal-verification", "sva", "vcd", "counterexample", "triage", "eda"]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
cx-triage = "cx_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cx_triage = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # Typer uses function-call defaults (Option/Argument) by design.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
