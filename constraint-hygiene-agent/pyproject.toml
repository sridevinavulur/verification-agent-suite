[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "constraint-hygiene-agent"
version = "0.1.0"
description = "Static, deterministic constraint-hygiene review for SVA assumptions/assertions/covers against an RTL Intent Manifest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Constraint Hygiene Agent contributors" }]
keywords = ["sva", "formal", "verification", "assumptions", "constraint", "hygiene"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "pydantic>=2.6,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
constraint-hygiene = "constraint_hygiene.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/constraint_hygiene"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4"]
ignore = [
    "B008",   # typer uses function-call defaults for Option/Argument
    "UP042",  # deliberate `str, Enum` for stable JSON values across py3.11+
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["constraint_hygiene", "conftest"]

[tool.mypy]
python_version = "3.11"
packages = ["constraint_hygiene"]
ignore_missing_imports = true
