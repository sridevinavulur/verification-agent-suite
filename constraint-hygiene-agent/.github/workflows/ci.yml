name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (types)
        run: mypy src/constraint_hygiene

      - name: Pytest
        run: pytest -q

      - name: Smoke-test CLI on examples
        run: |
          constraint-hygiene review examples/good/good_constraints.sva -m examples/dut_manifest.json >/dev/null
          constraint-hygiene review examples/bad/bad_constraints.sva -m examples/dut_manifest.json >/dev/null
          constraint-hygiene review examples/bad/bad_constraints.sva -m examples/dut_manifest.json -f json --fail-on error || true
          constraint-hygiene schema >/dev/null
