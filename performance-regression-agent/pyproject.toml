[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-regression-agent"
version = "0.1.0"
description = "Deterministic detection and explanation of performance regressions across commits, configs, workloads, and platforms."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "perf-regression-agent contributors" }]
keywords = ["performance", "regression", "rtl", "simulation", "formal", "fpga", "verification", "telemetry"]
dependencies = [
    "pydantic>=2.6,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
perf-regress = "perf_regression_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = [
    "B008",   # typer uses function-call defaults (typer.Argument/Option)
    "UP042",  # (str, Enum) is intentional for stable JSON serialization
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
