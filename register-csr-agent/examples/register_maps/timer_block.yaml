name: timer_block
data_width_bits: 32
address_unit_bytes: 1
registers:
  - name: CTRL
    address: 0x00
    width_bits: 32
    access: RW
    reset: 0x00000000
    description: Timer control register
    fields:
      - name: ENABLE
        bits: "0"
        access: RW
        reset: 0
        description: 1 = timer running
        side_effect: starts the timer counter
      - name: MODE
        bits: "2:1"
        access: RW
        reset: 0
        description: 0=one-shot 1=periodic
      - name: RSVD
        bits: "31:3"
        access: RESERVED
        reset: 0
  - name: LOAD
    address: 0x04
    width_bits: 32
    access: RW
    reset: 0xFFFFFFFF
    description: Reload value
  - name: COUNT
    address: 0x08
    width_bits: 32
    access: RO
    reset: 0x00000000
    description: Current counter value (read-only)
  - name: STATUS
    address: 0x0C
    width_bits: 32
    access: RW
    reset: 0
    description: Interrupt status
    fields:
      - name: EXPIRED
        bits: "0"
        access: W1C
        reset: 0
        interrupt_related: true
        description: set when timer expires, write 1 to clear
      - name: OVERRUN
        bits: "1"
        access: W1C
        reset: 0
        interrupt_related: true
      - name: RSVD
        bits: "31:2"
        access: RESERVED
        reset: 0
