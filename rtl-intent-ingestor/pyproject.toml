[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtl-intent-ingestor"
version = "0.1.0"
description = "Deterministic design-intelligence manifest extractor for a constrained synthesizable Verilog subset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RTL Intent Ingestor contributors" }]
keywords = ["verilog", "rtl", "verification", "formal", "parser"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "pydantic>=2.6,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
rtl-intent = "rtl_intent.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/rtl_intent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4"]
ignore = ["B008"]  # typer uses function-call defaults for Option/Argument

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rtl_intent", "conftest"]

[tool.mypy]
python_version = "3.11"
packages = ["rtl_intent"]
ignore_missing_imports = true
