name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Smoke-run the CLI on the toy benchmark (deterministic, mock executor)
        run: |
          ama run examples/counter.v examples/counter.sva --module counter \
            --json-out /tmp/counter_report.json --md-out /tmp/counter_report.md
          ama demo
