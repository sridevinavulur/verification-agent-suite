name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (types)
        run: mypy src/cdc_rdc_triage

      - name: Pytest
        run: pytest -q

      # Manifests are pre-committed in examples/expected/ so CI needs no RTL parser.
      - name: Smoke-test CLI on example manifests
        run: |
          cdc-rdc-triage triage examples/expected/cdc_sync.manifest.json >/dev/null
          cdc-rdc-triage report examples/expected/rdc_example.manifest.json >/dev/null
          cdc-rdc-triage triage examples/expected/single_clock.manifest.json >/dev/null
          cdc-rdc-triage schema >/dev/null
