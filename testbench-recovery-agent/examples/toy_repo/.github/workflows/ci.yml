name: sim

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verilate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog
      - name: Lint
        run: verilator --lint-only -Wall -f rtl/counter.f
      - name: Build and run
        run: |
          make build
          make run

  icarus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus
        run: sudo apt-get install -y iverilog
      - name: Run testbench
        run: make test
