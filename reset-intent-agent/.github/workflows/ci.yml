name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest
      - name: Smoke-test CLI on examples
        run: |
          reset-intent analyze examples/rtl/counter_async_low.sv > /dev/null
          reset-intent graph examples/rtl/dual_reset_domains.sv > /dev/null
          reset-intent report examples/rtl/ambiguous_polarity.sv > /dev/null
          reset-intent sva examples/rtl/counter_async_low.sv > /dev/null
          reset-intent analyze examples/manifests/counter_manifest.json > /dev/null
          reset-intent mutate examples/rtl/counter_async_low.sv > /dev/null
