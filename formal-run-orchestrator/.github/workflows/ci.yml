name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest (mock executor; no network, no secrets)
        run: pytest -q

      - name: Smoke test CLI end-to-end
        run: |
          formal-orchestrator init-suite --out /tmp/suite.json
          PLAN=$(formal-orchestrator plan --policy rule_based --db /tmp/ci.db | grep plan_id | sed 's/.*plan_id=//; s/ .*//')
          formal-orchestrator run "$PLAN" --db /tmp/ci.db
          formal-orchestrator summarize --plan-id "$PLAN" --db /tmp/ci.db
          formal-orchestrator compare --split test
