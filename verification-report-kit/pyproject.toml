[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verification-report-kit"
version = "0.1.0"
description = "Reusable, dependency-free HTML/JSON reporting for verification tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Verification Agent Team" }]
keywords = ["verification", "reporting", "html", "hardware", "eda"]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
vrk = "verification_report_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Typer idiomatically uses function calls (typer.Option/Argument) as defaults.
"src/verification_report_kit/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
